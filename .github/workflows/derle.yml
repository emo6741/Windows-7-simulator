name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: |
          mkdir proj
          unzip -q Win7SimuApp.zip -d proj
          d=$(dirname "$(find proj -name settings.gradle | head -1)")
          mv "$d" app_build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Derle
        run: gradle assembleDebug
        working-directory: app_build
      - uses: actions/upload-artifact@v4
        with:
          name: Win7Simu-debug-apk
          path: app_build/app/build/outputs/apk/debug/*.apk
